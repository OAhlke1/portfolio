<div class="center-block">
    <div class="logo-block">
        <a href="#top"><img src="../../../assets/images/logo.svg" alt=""></a>
        <div class="text-block">
            <p [ngClass]="{'disNone': !portService.englishActivated}">Oscar Ahlke, Web developer</p>
            <p [ngClass]="{'disNone': !portService.germanActivated}">Oscar Ahlke, Webentwickler</p>
            <p [ngClass]="{'disNone': !portService.englishActivated}">Münster Germany</p>
            <p [ngClass]="{'disNone': !portService.germanActivated}">Münster Deutschland</p>
        </div>
    </div>

    <div class="links">
        <div class="link-row">
            <a href="{{ portService.links.gitHubLink }}" target="_blank">Github</a>
            <p>/</p>
            <a href="{{ portService.links.linkedInLink }}" target="_blank">LinkedIn</a>
            <p>/</p>
            <a href="mailto:{{ portService.links.mailAddress }}">Email</a>
        </div>
        <div class="link-row" [ngClass]="{'disNone': !portService.englishActivated}">
            <a (click)="routes.navigateByUrl('terms-conditions')" class="cursor-pointer"><span>Terms and
                    Conditions</span></a>
            <p>/</p>
            <a (click)="routes.navigateByUrl('legal-notice')" class="cursor-pointer"><span>Legal Notice</span></a>
            <p>/</p>
            <a (click)="routes.navigateByUrl('privacy-policy')" class="cursor-pointer"><span>Privacy Policy</span></a>
        </div>
        <div class="link-row" [ngClass]="{'disNone': !portService.germanActivated}">
            <a (click)="routes.navigateByUrl('terms-conditions')" class="cursor-pointer"><span>AGB</span></a>
            <p>/</p>
            <a (click)="routes.navigateByUrl('legal-notice')" class="cursor-pointer"><span>Impressum</span></a>
            <p>/</p>
            <a (click)="routes.navigateByUrl('privacy-policy')"
                class="cursor-pointer"><span>Datenschutzerklärung</span></a>
        </div>
    </div>
</div>

<p class="copyright">© Oscar Ahlke 2025</p>
